name: Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  pages-deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Checkout is required here: wrangler compiles functions/ from the
      # current directory, and the artifact only carries dist/.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # No directory argument: it comes from `pages_build_output_dir` in
          # wrangler.toml, which is also what applies the bindings (D1, R2) on
          # deploy. Passing the directory alongside it is a validation error.
          command: pages deploy --project-name=files-hybris-world --branch=main
