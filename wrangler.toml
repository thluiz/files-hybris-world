# Cloudflare Pages project configuration.
#
# With `pages_build_output_dir` present, the bindings below are applied by
# the deploy itself — no need to configure them by hand in the dashboard. Changed a
# binding here? Just deploy again.
#
# Consequence: `wrangler pages deploy` runs WITHOUT a directory argument (it
# comes from here). Passing the directory alongside it is an error.

name = "files-hybris-world"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-01"

# DO NOT add `account_id` here: Pages config doesn't accept this field (only
# Workers config does). The credential can see more than one account, so local
# commands need the environment variable — see README:
#   CLOUDFLARE_ACCOUNT_ID=e8a97d34c66d7538dddf6603cf0089ee
# This is the account that hosts the hybris.world zone and Metron's hotsites.
# In CI, wrangler-action already receives accountId as an input.

# ── Production ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "hybris-files"
database_id = "e5989920-086d-4580-b8cc-b56265a5045b"

[[r2_buckets]]
binding = "FILES"
bucket_name = "hybris-files"

# ── Preview (branch deploys) ────────────────────────────────────────────────
# Same resources for now. If preview ever needs disposable data,
# this is where you'd point to a separate bucket/database.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "hybris-files"
database_id = "e5989920-086d-4580-b8cc-b56265a5045b"

[[env.preview.r2_buckets]]
binding = "FILES"
bucket_name = "hybris-files"
